<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Country Management dashboard for managing country records in a static browser app." />
  <title>Country Management Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="topbar-container"></div>
  <div id="sidebar-container"></div>
  <main class="main-panel" id="main-content">
    <section class="dashboard" id="dashboard-overview">
      <div class="stats-grid" aria-label="Summary statistics">
        <article class="stat-card">
          <span class="stat-label">Total countries</span>
          <strong id="totalCountries">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Favorites</span>
          <strong id="favoritesCount">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Total population</span>
          <strong id="totalPopulation">0</strong>
        </article>
        <article class="stat-card accent-card">
          <span class="stat-label">Recent activity</span>
          <strong id="recentActivityCount">0</strong>
        </article>
      </div>

      <section class="panel">
        <div class="panel-header">
          <h3>Quick Actions</h3>
          <div class="toolbar">
            <a class="secondary-button" href="countries.html">Manage Countries</a>
            <a class="secondary-button" href="analytics.html">View Analytics</a>
            <a class="secondary-button" href="favorites.html">Favorites</a>
          </div>
        </div>

        <div class="panel-body" id="dashboard-widgets">
          <section class="stat-card" id="top-populated">
            <h4>Top Populated Countries</h4>
            <ul id="topPopList"></ul>
          </section>

          <section class="stat-card" id="recent-searches">
            <h4>Recent Searches</h4>
            <ul id="recentSearches"></ul>
          </section>
        </div>
      </section>
    </section>
  </main>

  <div id="countryModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h3 id="modalTitle">Add Country</h3>
        <button class="icon-button" type="button" data-close-modal aria-label="Close modal">×</button>
      </div>

      <form id="countryForm" class="country-form" novalidate>
        <input type="hidden" id="countryId" />
        <label>
          <span>Country name</span>
          <input id="countryName" type="text" required maxlength="60" placeholder="Example: Canada" />
        </label>
        <label>
          <span>Capital</span>
          <input id="countryCapital" type="text" required maxlength="60" placeholder="Example: Ottawa" />
        </label>
        <label>
          <span>Population</span>
          <input id="countryPopulation" type="number" min="0" step="1" required placeholder="Example: 38000000" />
        </label>
        <label>
          <span>Currency</span>
          <input id="countryCurrency" type="text" required maxlength="40" placeholder="Example: Canadian Dollar" />
        </label>
        <label>
          <span>Continent</span>
          <select id="countryContinent" required>
            <option value="">Select a continent</option>
            <option value="Africa">Africa</option>
            <option value="Americas">Americas</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="Oceania">Oceania</option>
          </select>
        </label>
        <label class="full-width">
          <span>Flag URL</span>
          <input id="countryFlagURL" type="url" required placeholder="Example: https://example.com/flag.png" />
        </label>
        <p id="formError" class="form-error" aria-live="polite"></p>

        <div class="form-actions">
          <button class="secondary-button" type="button" data-close-modal>Cancel</button>
          <button class="primary-button" type="submit">Save Country</button>
        </div>
      </form>
    </section>
  </div>

  <div id="detailsModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-details></div>
    <section class="modal-dialog modal-dialog-wide" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
      <div class="modal-header">
        <h3 id="detailsTitle">Country Details</h3>
        <button class="icon-button" type="button" data-close-details aria-label="Close details">×</button>
      </div>
      <div id="detailsContent" class="details-card"></div>
    </section>
  </div>

  <div id="confirmModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-cancel-delete></div>
    <section class="modal-dialog modal-dialog-small" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="modal-header">
        <h3 id="confirmTitle">Confirm deletion</h3>
        <button class="icon-button" type="button" data-cancel-delete aria-label="Close delete confirmation">×</button>
      </div>
      <p id="confirmMessage" class="confirm-message"></p>
      <div class="form-actions">
        <button class="secondary-button" type="button" data-cancel-delete>Cancel</button>
        <button id="confirmDeleteButton" class="danger-button" type="button">Delete Country</button>
      </div>
    </section>
  </div>

  <div id="loadingOverlay" class="loading-overlay" aria-hidden="true" hidden>
    <div class="loading-card" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
  </body>
</html>
