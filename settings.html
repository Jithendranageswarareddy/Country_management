<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings — Country Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topbar-container"></div>
  <div id="sidebar-container"></div>
  <main class="main-panel">
    <section class="panel">
      <div class="panel-header"><h3>Settings</h3></div>
      <div class="panel-body">
        <label>Theme: <button id="themeToggleSmall" class="secondary-button">Toggle</button></label>
        <label>Animations: <input id="animToggle" type="checkbox" checked /></label>
        <div style="margin-top:12px">
          <button id="resetBtn" class="danger-button">Reset Countries (restore defaults)</button>
          <button id="exportBtn" class="secondary-button">Export Data</button>
          <input id="impFile" type="file" accept=".json" hidden />
          <button id="importBtn" class="secondary-button">Import Data</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/common.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
