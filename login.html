<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Country Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel">
      <div class="login-copy">
        <h1>Welcome to Country Hub</h1>
        <p>Sign in to your account</p>
      </div>
    </section>

    <section class="login-form-card panel">
      <form id="loginForm" class="login-form">
        <label class="field">
          <span>Username</span>
          <input id="username" type="text" autocomplete="username" placeholder="admin or user" required />
        </label>
        <label class="field">
          <span>Password</span>
          <div class="password-field">
            <input id="password" type="password" autocomplete="current-password" required />
            <button id="togglePass" class="password-toggle" type="button" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </label>
        <p id="loginError" class="form-error" aria-live="polite"></p>
        <div class="form-actions login-actions">
          <button class="primary-button" type="submit">Sign in</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
