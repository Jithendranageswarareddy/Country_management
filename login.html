<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Country Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main-panel" style="display:grid;place-items:center;min-height:100vh;padding:24px;">
    <section class="panel" style="max-width:420px;width:100%;">
      <h3>Sign in to Country Hub</h3>
      <p class="form-error" style="margin-top:0;margin-bottom:12px;">Credentials: admin / admin123 or user / user123</p>
      <form id="loginForm">
        <label>Username<input id="username" required /></label>
        <label>Password
          <div style="display:flex;gap:8px;align-items:center;"><input id="password" type="password" required/><button id="togglePass" type="button">Show</button></div>
        </label>
        <label>Role<select id="role"><option>Admin</option><option>User</option></select></label>
        <p id="loginError" class="form-error" aria-live="polite"></p>
        <div class="form-actions">
          <button class="primary-button" type="submit">Sign in</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
