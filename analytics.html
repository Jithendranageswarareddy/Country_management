<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Analytics — Country Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topbar-container"></div>
  <div id="sidebar-container"></div>
  <main class="main-panel">
    <section class="panel">
      <div class="panel-header"><h3>Analytics</h3></div>
      <div class="panel-body">
        <div class="stat-card">
          <h4>Largest population</h4>
          <div id="largest"></div>
        </div>
        <div class="stat-card">
          <h4>Smallest population</h4>
          <div id="smallest"></div>
        </div>
        <div class="stat-card">
          <h4>Average population</h4>
          <div id="avg"></div>
        </div>
        <div class="stat-card">
          <h4>Countries per continent</h4>
          <div id="perContinent"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/common.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
